<style>
/* ============================================================
   AI妈妈 · 视觉系统 v2（自包含）
   深色科技风（默认）× 浅色清爽 双主题
   玻璃拟态卡片 + 品牌渐变 + 光晕氛围 + 进场动效
   ============================================================ */
:root {
  --bg: #06080f;
  --bg-soft: #0b0f1a;
  --glass: rgba(255,255,255,.045);
  --glass-strong: rgba(255,255,255,.08);
  --border: rgba(255,255,255,.09);
  --border-bright: rgba(255,255,255,.16);
  --text: #eef2f9;
  --text-dim: #97a1b3;
  --text-faint: #5c6675;

  --brand-1: #ff6b3d;
  --brand-2: #ffa63d;
  --grad: linear-gradient(135deg, #ff6b3d 0%, #ffa63d 100%);
  --grad-soft: linear-gradient(135deg, rgba(255,107,61,.16), rgba(255,166,61,.10));
  --tech: #34e0c8;
  --flow: #5aa7ff;
  --sample: #b98cff;
  --success: #4ade80;
  --danger: #ff5d5d;
  --warn: #ffc53d;

  --r-lg: 20px;
  --r-md: 14px;
  --shadow: 0 12px 40px rgba(0,0,0,.5);
  --glow-brand: 0 6px 24px rgba(255,107,61,.30);
}
[data-theme="light"] {
  --bg: #f2f4f9;
  --bg-soft: #ffffff;
  --glass: rgba(255,255,255,.78);
  --glass-strong: rgba(20,35,70,.05);
  --border: rgba(20,35,70,.09);
  --border-bright: rgba(20,35,70,.18);
  --text: #171d2b;
  --text-dim: #5c6678;
  --text-faint: #9aa3b5;
  --shadow: 0 10px 32px rgba(30,45,90,.10);
  --glow-brand: 0 6px 22px rgba(255,107,61,.25);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 15px; line-height: 1.65;
  min-height: 100vh;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
  overflow-x: hidden;
  transition: background .3s, color .3s;
}
/* 氛围光晕 */
body::before {
  content:''; position:fixed; z-index:-1; pointer-events:none;
  top:-220px; left:50%; transform:translateX(-50%);
  width:640px; height:520px; border-radius:50%;
  background: radial-gradient(closest-side, rgba(255,107,61,.16), transparent 72%);
  filter: blur(10px);
}
body::after {
  content:''; position:fixed; z-index:-1; pointer-events:none;
  bottom:-260px; right:-160px;
  width:480px; height:480px; border-radius:50%;
  background: radial-gradient(closest-side, rgba(52,224,200,.09), transparent 70%);
  filter: blur(14px);
}
.hidden { display:none !important; }

/* ---------- 顶部栏 ---------- */
.topbar {
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom:1px solid var(--border);
}
.brand { display:flex; align-items:center; gap:12px; }
.avatar {
  width:42px; height:42px; border-radius:14px;
  background:#171e33;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:18px; color:#221002;
  box-shadow: 0 4px 16px rgba(239,79,48,.35);
  position:relative;
}
.avatar::after {
  content:''; position:absolute; inset:0; border-radius:14px;
  background: linear-gradient(180deg, rgba(255,255,255,.10), transparent 55%);
  pointer-events:none;
}
.avatar svg, .mama-avatar svg, .mini-avatar svg {
  width: 92%; height: 92%; display:block; color:rgba(255,255,255,.18); position:relative; z-index:1;
}
.brand-name { font-size:17px; font-weight:800; letter-spacing:.4px; display:flex; align-items:center; gap:8px; }
.brand-sub { font-size:11px; color:var(--text-dim); }
.demo-chip {
  font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px;
  background:rgba(90,167,255,.16); color:var(--flow); border:1px solid rgba(90,167,255,.3);
}
.icon-btn {
  background:var(--glass); border:1px solid var(--border);
  color:var(--text); width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition: transform .15s, border-color .15s;
}
.icon-btn:active { transform:scale(.92); border-color:var(--border-bright); }

/* ---------- 页面 ---------- */
.page { padding:18px; animation: pageIn .35s cubic-bezier(.22,.8,.32,1); }
@keyframes pageIn { from { opacity:0; transform:translateY(14px);} to { opacity:1; transform:none;} }

/* ---------- 妈妈点评卡 ---------- */
.mama-card {
  position:relative; overflow:hidden;
  display:flex; gap:13px; align-items:flex-start;
  background: var(--grad-soft);
  border:1px solid rgba(255,140,80,.28);
  border-radius: var(--r-lg); padding:16px; margin-bottom:18px;
}
.mama-card::before {
  content:''; position:absolute; right:-40px; top:-40px;
  width:150px; height:150px; border-radius:50%;
  background: radial-gradient(closest-side, rgba(255,166,61,.22), transparent);
}
.mama-avatar {
  flex:0 0 38px; width:38px; height:38px; border-radius:50%;
  background:#171e33; color:rgba(255,255,255,.18); font-weight:800;
  display:flex; align-items:center; justify-content:center; font-size:16px;
  box-shadow: 0 4px 14px rgba(239,79,48,.35);
}
.mama-bubble { font-size:14px; flex:1; position:relative; }
.mama-bubble b { color:var(--brand-2); }
[data-theme="light"] .mama-bubble b { color:#e05a28; }
[data-theme="light"] .fresh-banner .txt b { color:#c2185b; }
.badge-video { background:linear-gradient(135deg,#fb7299,#ff5c8a)!important; color:#fff!important; font-weight:700; }
.badge-jump { background:linear-gradient(135deg,#fe2c55,#ff6b81)!important; color:#fff!important; font-weight:700; }
.tabs-plat { margin-bottom:8px; }
.tabs-plat .tab { border:1px solid rgba(255,138,180,.28); }
.tabs-plat .tab.active { border-color:transparent; }
.tab-num { display:inline-block; min-width:16px; padding:0 4px; margin-left:2px; border-radius:8px; background:rgba(255,255,255,.16); font-size:10.5px; font-weight:700; text-align:center; }
[data-theme="light"] .tab-num { background:rgba(0,0,0,.08); }

/* ---------- 统计 ---------- */
.stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px; }
/* 数据新鲜度横幅 */
.fresh-banner{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 14px; margin:0 0 16px; border-radius:14px;
  background:linear-gradient(135deg, rgba(255,138,180,.16), rgba(180,138,255,.14));
  border:1px solid rgba(255,138,180,.32);
  font-size:12.5px; line-height:1.5; color:var(--text,#f5f5f7);
}
.fresh-banner .dot{
  width:7px; height:7px; border-radius:50%; background:#34d399; flex:none;
  box-shadow:0 0 0 0 rgba(52,211,153,.7); animation:pulseDot 2s infinite;
}
@keyframes pulseDot{
  0%{box-shadow:0 0 0 0 rgba(52,211,153,.55);}
  70%{box-shadow:0 0 0 7px rgba(52,211,153,0);}
  100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}
}
.fresh-banner .txt{ flex:1; min-width:180px; }
.fresh-banner .txt b{ color:#ffd6e7; font-weight:600; }
.fresh-banner .refresh{
  flex:none; cursor:pointer; user-select:none;
  padding:4px 11px; border-radius:999px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);
  font-size:12px; color:#fff; transition:background .2s;
}
.fresh-banner .refresh:hover{ background:rgba(255,255,255,.2); }
.stat {
  background:var(--glass); border:1px solid var(--border);
  border-radius:var(--r-md); padding:14px 8px 12px; text-align:center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  position:relative; overflow:hidden;
}
.stat::before {
  content:''; position:absolute; top:0; left:20%; right:20%; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,166,61,.5), transparent);
}
.stat-num {
  font-size:26px; font-weight:800; line-height:1.15;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.stat-label { font-size:11px; color:var(--text-dim); margin-top:3px; }

/* ---------- 区块标题 ---------- */
.section-head { display:flex; align-items:center; justify-content:space-between; margin:20px 0 12px; }
.section-head h2 {
  font-size:17px; font-weight:800; letter-spacing:.3px;
  display:flex; align-items:center; gap:8px;
}
.section-head h2::before {
  content:''; width:4px; height:16px; border-radius:4px; background:var(--grad);
}
.more { font-size:13px; color:var(--brand-2); cursor:pointer; font-weight:600; }
[data-theme="light"] .more { color:#e05a28; }

/* ---------- 卡片 ---------- */
.card-list { display:flex; flex-direction:column; gap:12px; }
.card {
  position:relative; overflow:hidden;
  background:var(--glass); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:16px; cursor:pointer;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: transform .18s cubic-bezier(.22,.8,.32,1), border-color .18s;
  animation: cardIn .5s cubic-bezier(.22,.8,.32,1) backwards;
}
@keyframes cardIn { from { opacity:0; transform:translateY(16px) scale(.98);} to { opacity:1; transform:none;} }
.card:nth-child(1) { animation-delay:.02s; } .card:nth-child(2) { animation-delay:.07s; }
.card:nth-child(3) { animation-delay:.12s; } .card:nth-child(4) { animation-delay:.17s; }
.card:nth-child(5) { animation-delay:.22s; } .card:nth-child(6) { animation-delay:.27s; }
.card:active { transform:scale(.98); }
.card::before {
  content:''; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0 4px 4px 0;
}
.card.type-flow::before { background:var(--flow); box-shadow:0 0 12px rgba(90,167,255,.5); }
.card.type-prize::before { background:var(--grad); box-shadow:0 0 12px rgba(255,107,61,.5); }
.card.type-product::before { background:var(--tech); box-shadow:0 0 12px rgba(52,224,200,.5); }
.card.type-sample::before { background:var(--sample); box-shadow:0 0 12px rgba(185,140,255,.5); }

.card-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.platform {
  font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
  background:var(--glass-strong); color:var(--text-dim); border:1px solid var(--border);
}
.badge { font-size:11px; padding:3px 9px; border-radius:20px; font-weight:700; letter-spacing:.3px; }
.badge-flow { background:rgba(90,167,255,.14); color:var(--flow); }
.badge-prize { background:rgba(255,107,61,.14); color:var(--brand-2); }
[data-theme="light"] .badge-prize { color:#e05a28; }
.badge-product { background:rgba(52,224,200,.14); color:var(--tech); }
[data-theme="light"] .badge-product { color:#0aa892; }
.badge-sample { background:rgba(185,140,255,.14); color:var(--sample); }
[data-theme="light"] .badge-sample { color:#7c4ddb; }
.badge-urgent { background:rgba(255,93,93,.14); color:var(--danger); }

.card-title { font-size:15.5px; font-weight:700; margin-bottom:6px; line-height:1.45; }
.card-summary {
  font-size:12.5px; color:var(--text-dim); margin-bottom:10px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card-reward { font-size:13.5px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:7px; }
.card-reward .coin {
  width:18px; height:18px; border-radius:50%; background:var(--grad);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:800; color:#221002; flex:0 0 auto;
}
.card-foot { display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--text-faint); }
.card-comment {
  font-size:12.5px; margin-top:10px; padding-top:10px;
  border-top:1px dashed var(--border); color:var(--text-dim);
  display:flex; gap:8px; align-items:flex-start;
}
.card-comment .mini-avatar {
  flex:0 0 20px; width:20px; height:20px; border-radius:50%; background:#171e33;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:800; color:rgba(255,255,255,.18); margin-top:2px;
}

/* ---------- 搜索与标签 ---------- */
.search-bar { position:relative; margin-bottom:14px; }
.search-bar svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--text-faint); pointer-events:none; }
.search-bar input {
  width:100%; padding:13px 16px 13px 42px; border-radius:16px;
  background:var(--glass); border:1px solid var(--border);
  color:var(--text); font-size:14px; outline:none; font-family:inherit;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  transition: border-color .2s, box-shadow .2s;
}
.search-bar input:focus { border-color:rgba(255,140,80,.5); box-shadow:0 0 0 4px rgba(255,107,61,.10); }
.search-bar input::placeholder { color:var(--text-faint); }
.tabs { display:flex; gap:9px; overflow-x:auto; padding:2px 2px 12px; margin-bottom:4px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab {
  flex:0 0 auto; padding:8px 16px; border-radius:22px; font-size:13px; font-weight:600;
  background:var(--glass); border:1px solid var(--border); color:var(--text-dim);
  cursor:pointer; white-space:nowrap; transition:all .2s; font-family:inherit;
}
.tab:active { transform:scale(.95); }
.tab.active {
  background:var(--grad); color:#221002; font-weight:800; border-color:transparent;
  box-shadow: var(--glow-brand);
}

/* ---------- 详情 ---------- */
.back-btn {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--glass); border:1px solid var(--border); color:var(--text-dim);
  padding:8px 14px; border-radius:12px; font-size:13px; cursor:pointer; margin-bottom:14px;
  font-family:inherit; transition:all .15s;
}
.back-btn:active { transform:scale(.95); }
.detail-head { margin-bottom:16px; }
.detail-title { font-size:21px; font-weight:800; line-height:1.4; margin:10px 0 4px; letter-spacing:.2px; }
.detail-block {
  background:var(--glass); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:16px; margin-bottom:12px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.detail-block h3 {
  font-size:11.5px; color:var(--text-faint); font-weight:700;
  margin-bottom:10px; letter-spacing:1.5px;
}
.detail-block p { font-size:14px; }
.kv { display:flex; gap:10px; font-size:13.5px; padding:8px 0; border-bottom:1px dashed var(--border); line-height:1.6; }
.kv:last-child { border-bottom:none; padding-bottom:0; }
.kv .k { color:var(--text-faint); flex:0 0 76px; font-size:12.5px; }
.kv .v { flex:1; min-width:0; word-break:break-all; }
.kv .v a { color:var(--tech); text-decoration:none; }
[data-theme="light"] .kv .v a { color:#0aa892; }

/* ---------- 按钮 ---------- */
.btn {
  width:100%; padding:15px; border-radius:16px; border:none;
  font-size:15.5px; font-weight:800; cursor:pointer; margin-top:12px;
  background:var(--grad); color:#221002; font-family:inherit; letter-spacing:.5px;
  box-shadow: var(--glow-brand);
  transition: transform .15s, box-shadow .15s; position:relative; overflow:hidden;
}
.btn::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.28), transparent 50%);
  pointer-events:none;
}
.btn:active { transform:scale(.97); }
.btn-ghost {
  background:var(--glass); color:var(--text); border:1px solid var(--border);
  box-shadow:none; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.btn-ghost::after { display:none; }
.btn-danger { background:rgba(255,93,93,.10); color:var(--danger); border:1px solid rgba(255,93,93,.3); box-shadow:none; }
.btn-danger::after { display:none; }
.btn-mini {
  padding:7px 13px; font-size:12px; border-radius:10px; font-weight:700;
  background:var(--glass); border:1px solid var(--border); color:var(--brand-2);
  cursor:pointer; width:auto; margin:0; font-family:inherit; transition:all .15s;
}
[data-theme="light"] .btn-mini { color:#e05a28; }
.btn-mini:active { transform:scale(.94); }

/* ---------- 评分 ---------- */
.score-row { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.score-name { flex:0 0 92px; font-size:12.5px; color:var(--text-dim); font-weight:600; }
.score-bar { flex:1; height:8px; border-radius:6px; background:var(--glass-strong); overflow:hidden; border:1px solid var(--border); }
.score-fill { height:100%; border-radius:6px; background:var(--grad); transition: width .8s cubic-bezier(.22,.8,.32,1); }
.score-val { flex:0 0 36px; text-align:right; font-size:13px; font-weight:800; }
.score-note { font-size:12px; color:var(--text-faint); margin:0 0 14px 104px; line-height:1.6; }
.big-score { text-align:center; padding:20px 0 14px; }
.big-score .num {
  font-size:56px; font-weight:800; line-height:1;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter: drop-shadow(0 4px 18px rgba(255,107,61,.35));
}
.big-score .verdict { font-size:14.5px; color:var(--brand-2); margin-top:10px; font-weight:700; }
[data-theme="light"] .big-score .verdict { color:#e05a28; }

/* ---------- 输入 ---------- */
textarea {
  width:100%; min-height:150px; padding:14px; border-radius:16px;
  background:var(--glass); border:1px solid var(--border);
  color:var(--text); font-size:14px; font-family:inherit; line-height:1.7;
  outline:none; resize:vertical;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:border-color .2s, box-shadow .2s;
}
textarea:focus { border-color:rgba(255,140,80,.5); box-shadow:0 0 0 4px rgba(255,107,61,.10); }
textarea::placeholder { color:var(--text-faint); }

.compare { display:grid; gap:12px; margin:12px 0; }
.compare-col {
  background:var(--glass); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:14px;
}
.compare-col h4 { font-size:12px; color:var(--text-faint); margin-bottom:8px; letter-spacing:1px; }
.compare-col .txt { font-size:13px; white-space:pre-wrap; max-height:260px; overflow-y:auto; line-height:1.8; }
.compare-col.new { border-color:rgba(255,140,80,.45); background:var(--grad-soft); }

/* ---------- 列表项 / 状态 ---------- */
.list-item {
  background:var(--glass); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:15px; margin-bottom:12px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  animation:cardIn .4s cubic-bezier(.22,.8,.32,1) backwards;
}
.li-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.status { font-size:11px; padding:3px 10px; border-radius:20px; font-weight:700; }
.status-ongoing { background:rgba(255,197,61,.14); color:var(--warn); }
.status-submitted { background:rgba(52,224,200,.14); color:var(--tech); }
.status-won { background:rgba(74,222,128,.14); color:var(--success); }
.status-ended { background:var(--glass-strong); color:var(--text-faint); }

/* ---------- 打卡进度看板 ---------- */
.rec-card {
  position:relative; overflow:hidden;
  background:var(--glass); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:15px; margin-bottom:13px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.rec-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:var(--grad);
}
.rec-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.rec-title { font-size:15px; font-weight:700; line-height:1.45; margin-bottom:10px; }
.rec-steps { display:flex; align-items:center; gap:0; margin:12px 0 14px; }
.rec-step { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; position:relative; }
.rec-step .dot {
  width:19px; height:19px; border-radius:50%; border:2px solid var(--border-bright);
  background:var(--bg); display:flex; align-items:center; justify-content:center;
  font-size:10px; color:var(--text-faint); z-index:1; transition:all .25s;
}
.rec-step.done .dot { background:var(--grad); border-color:transparent; color:#221002; font-weight:800; }
.rec-step.cur .dot { border-color:var(--brand-2); color:var(--brand-2); box-shadow:0 0 0 4px rgba(255,140,80,.16); }
.rec-step .lbl { font-size:9.5px; color:var(--text-faint); text-align:center; line-height:1.3; }
.rec-step.done .lbl, .rec-step.cur .lbl { color:var(--text-dim); font-weight:600; }
.rec-step::after {
  content:''; position:absolute; top:9px; left:50%; width:100%; height:2px;
  background:var(--border); z-index:0;
}
.rec-step:last-child::after { display:none; }
.rec-step.done::after { background:var(--grad); }
.rec-metrics { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.rec-metric {
  flex:1; min-width:78px; background:var(--glass-strong); border:1px solid var(--border);
  border-radius:13px; padding:9px 11px;
}
.rec-metric .mv { font-size:17px; font-weight:800; letter-spacing:-.3px; }
.rec-metric .mv.hi { background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.rec-metric .ml { font-size:10px; color:var(--text-faint); margin-top:2px; }
.rec-actions { display:flex; gap:8px; flex-wrap:wrap; }
.rec-actions .btn-mini.primary {
  background:var(--grad); color:#221002; font-weight:800; border:none;
}
/* 打卡弹窗表单 */
.ci-form label { display:block; font-size:12px; color:var(--text-dim); margin:12px 0 6px; font-weight:600; }
.ci-form input, .ci-form select, .ci-form textarea {
  width:100%; padding:11px 13px; border-radius:13px; font-size:14px;
  background:var(--glass-strong); border:1px solid var(--border);
  color:var(--text); outline:none; font-family:inherit;
}
.ci-form input:focus, .ci-form select:focus, .ci-form textarea:focus { border-color:var(--brand-2); }
.ci-status-grid { display:flex; gap:7px; flex-wrap:wrap; margin-top:6px; }
.ci-status-grid .st-chip {
  padding:7px 13px; border-radius:20px; font-size:12.5px; cursor:pointer;
  background:var(--glass-strong); border:1px solid var(--border); color:var(--text-dim);
  transition:all .18s;
}
.ci-status-grid .st-chip.on { background:var(--grad); color:#221002; font-weight:700; border-color:transparent; }
.rec-summary { display:flex; gap:9px; margin-bottom:16px; }
.rec-summary .sm {
  flex:1; background:var(--grad-soft); border:1px solid rgba(255,140,80,.24);
  border-radius:15px; padding:12px; text-align:center;
}
.rec-summary .sm .n { font-size:20px; font-weight:800; background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.rec-summary .sm .t { font-size:10.5px; color:var(--text-dim); margin-top:3px; }

/* ---------- 设置 ---------- */
.engine-chip {
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  font-size:11.5px; font-weight:700; padding:7px 12px; border-radius:10px;
  margin-bottom:12px; line-height:1.5;
}
.engine-chip .why { font-weight:500; color:var(--text-faint); font-size:11px; }
.engine-chip.ai {
  background:linear-gradient(135deg, rgba(255,107,61,.14), rgba(255,166,61,.08));
  border:1px solid rgba(255,140,61,.32); color:var(--brand-2);
}
.engine-chip.rule {
  background:var(--glass); border:1px solid var(--border); color:var(--text-dim);
}
.ai-status {
  display:flex; align-items:center; gap:8px;
  font-size:12.5px; padding:9px 12px; border-radius:10px; margin-bottom:12px;
}
.ai-status.on { background:rgba(74,222,128,.10); border:1px solid rgba(74,222,128,.28); color:var(--success); }
.ai-status.off { background:rgba(255,197,61,.08); border:1px solid rgba(255,197,61,.26); color:var(--warn); }
.engine-pick {
  display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px;
}
.engine-pick .ep {
  flex:1 1 46%; min-width:140px; text-align:left;
  background:var(--glass); border:1px solid var(--border); border-radius:12px;
  padding:10px 12px; cursor:pointer; transition:.18s;
}
.engine-pick .ep.on { border-color:var(--brand-1); background:rgba(255,107,61,.10); }
.engine-pick .ep .n { font-size:13px; font-weight:800; }
.engine-pick .ep .d { font-size:11px; color:var(--text-faint); margin-top:3px; line-height:1.5; }
.guide-box {
  background:var(--glass); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px; font-size:12.5px; line-height:1.9; color:var(--text-dim);
  margin-top:10px;
}
.guide-box b { color:var(--text); }
.guide-box ol { margin:8px 0 0 16px; }
.guide-box li { margin-bottom:4px; }
.guide-box a { color:var(--brand-2); text-decoration:none; border-bottom:1px dashed; }

.setting-item {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:16px; background:var(--glass); border:1px solid var(--border);
  border-radius:var(--r-md); margin-bottom:11px;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.setting-col { flex-direction:column; align-items:flex-start; }
.setting-label { font-size:14.5px; font-weight:700; }
.setting-desc { font-size:11.5px; color:var(--text-faint); margin-top:3px; }
.switch {
  width:50px; height:28px; border-radius:20px; background:var(--glass-strong);
  border:1px solid var(--border); position:relative; cursor:pointer;
  flex:0 0 auto; transition:background .25s;
}
.switch::after {
  content:''; position:absolute; top:2px; left:2px; width:22px; height:22px;
  border-radius:50%; background:var(--text-faint); transition:all .25s cubic-bezier(.22,.8,.32,1);
}
.switch.on { background:var(--grad); border-color:transparent; box-shadow:var(--glow-brand); }
.switch.on::after { left:24px; background:#fff; }
.platform-chips { display:flex; flex-wrap:wrap; gap:9px; margin-top:12px; }
.chip {
  padding:8px 15px; border-radius:22px; font-size:13px; font-weight:600;
  background:var(--glass-strong); border:1px solid var(--border); color:var(--text-dim);
  cursor:pointer; transition:all .2s;
}
.chip:active { transform:scale(.94); }
.chip.on { background:var(--grad); color:#221002; font-weight:800; border-color:transparent; }
.setting-input {
  background:var(--glass-strong); border:1px solid var(--border); color:var(--text);
  padding:9px 13px; border-radius:12px; font-size:13px; outline:none; width:172px; text-align:right; font-family:inherit;
}
.setting-input:focus { border-color:rgba(255,140,80,.5); }

/* ---------- 底部导航 ---------- */
.tabbar {
  position:fixed; bottom:0; left:0; right:0; z-index:60;
  display:flex; justify-content:space-around;
  background: color-mix(in srgb, var(--bg-soft) 78%, transparent);
  backdrop-filter: blur(24px) saturate(1.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5);
  border-top:1px solid var(--border);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-item {
  flex:1; background:none; border:none; color:var(--text-faint);
  font-size:10.5px; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  cursor:pointer; padding:5px 0 3px; font-family:inherit;
  transition:color .2s; position:relative;
}
.nav-item svg { width:22px; height:22px; }
.nav-item.active { color:var(--brand-2); font-weight:800; }
[data-theme="light"] .nav-item.active { color:#e05a28; }
.nav-item.active::before {
  content:''; position:absolute; top:-9px; width:26px; height:3px; border-radius:0 0 4px 4px;
  background:var(--grad);
}

/* ---------- 模态 / Toast ---------- */
.modal-mask {
  position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.65);
  display:flex; align-items:center; justify-content:center; padding:24px;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  animation:fade .2s;
}
.modal {
  background:var(--bg-soft); border:1px solid var(--border-bright);
  border-radius:22px; padding:22px; width:100%; max-width:430px;
  max-height:80vh; overflow-y:auto; box-shadow:var(--shadow);
  animation:modalIn .3s cubic-bezier(.22,.8,.32,1);
}
@keyframes modalIn { from { opacity:0; transform:scale(.92) translateY(10px);} to { opacity:1; transform:none;} }
@keyframes fade { from{opacity:0;} to{opacity:1;} }
.modal h3 { font-size:17px; margin-bottom:12px; font-weight:800; }
.modal p { font-size:13.5px; color:var(--text-dim); margin-bottom:14px; }

.toast {
  position:fixed; bottom:104px; left:50%; transform:translateX(-50%);
  background:var(--glass-strong); color:var(--text); padding:11px 20px;
  border-radius:24px; font-size:13.5px; z-index:200; font-weight:600;
  border:1px solid var(--border-bright); box-shadow:var(--shadow);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  max-width:84vw; text-align:center; animation:fade .3s;
}

/* ---------- 空状态 / 加载 ---------- */

<script>
/* ============================================================

(function () {
  'use strict';

  var LS_KEY = 'AIMAMA_DATA_V1';
  // 支持 ?reset=1 强制清空本地缓存（用于极端情况的修复）
  try { if (/[?&]reset=1/.test(location.href)) { localStorage.removeItem(LS_KEY); console.log('[AI妈妈] 已按请求重置本地数据'); } } catch (e) {}

  /* ---------- 存储层 ---------- */
  function defaultData() {
    return JSON.parse(JSON.stringify(window.__AIMAMA_SEED__ || {
      opportunities: [], lessons: [], contents: [], records: [], reports: [], settings: {}
    }));
  }

  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) { var d = defaultData(); save(d); return d; }
      var parsed = JSON.parse(raw);
      // ★ 先记住本地数据自带的更新时间（必须在补齐字段之前，否则旧数据会被新种子的时间污染）
      var storedStamp = parsed.dataUpdatedAt;   // 老数据没有这个字段 → undefined
      // 补齐缺失的集合（版本升级时）
      var base = defaultData();
      Object.keys(base).forEach(function (k) {
        if (parsed[k] === undefined) parsed[k] = base[k];
      });
      // —— 数据新鲜度迁移：网址上的种子数据比本地新时，自动更新机会与经验 ——
      // （保留用户自己的：记录 records、内容 contents、周报 reports、设置 settings）
      try {
        function ts(x){ var t=Date.parse(x||''); return isNaN(t)?0:t; }
        var seedTime = ts(window.__AIMAMA_SEED__ && window.__AIMAMA_SEED__.dataUpdatedAt);
        var localTime = ts(storedStamp);
        // 本地没有时间戳（老版本数据）或比种子旧 → 都视为需要更新
        if (seedTime > 0 && (localTime === 0 || seedTime > localTime)) {
          parsed.opportunities = base.opportunities;
          parsed.lessons = base.lessons;
          parsed.dataUpdatedAt = window.__AIMAMA_SEED__.dataUpdatedAt;
          parsed.dataDateLabel = window.__AIMAMA_SEED__.dataDateLabel || parsed.dataDateLabel;
          if (window.__AIMAMA_SEED__.seedVersion) parsed.seedVersion = window.__AIMAMA_SEED__.seedVersion;
          console.log('[AI妈妈] 检测到新数据，已自动更新机会列表 →', parsed.dataUpdatedAt);
          save(parsed);
        }
      } catch (migErr) { console.warn('[AI妈妈] 数据迁移检查失败', migErr); }
      return parsed;
    } catch (e) {
      console.warn('[AI妈妈] 本地数据读取失败，已重置', e);
      var fresh = defaultData();
      save(fresh);
      return fresh;
    }
  }

  function save(d) {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(d));
      return true;
    } catch (e) {
      console.error('[AI妈妈] 本地数据保存失败', e);
      return false;
    }
  }

  var DB = load();

  /* ---------- 工具 ---------- */
  function uid(prefix) {
    return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  }
  function now() { return new Date().toISOString(); }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function rewardValue(o) {
    if (!o) return 0;
    if (typeof o.rewardValue === 'number') return o.rewardValue;
    var s = String(o.reward || o.prize || '');
    var m = s.match(/(\d+(?:\.\d+)?)\s*万/);
    if (m) return parseFloat(m[1]) * 10000;
    m = s.match(/(\d+(?:\.\d+)?)\s*元/);
    if (m) return parseFloat(m[1]);
    m = s.match(/(\d+(?:\.\d+)?)/);
    return m ? parseFloat(m[1]) : 0;
  }

  /* ---------- 评估规则引擎（原 lib/ai-tasks.js 的本地降级实现） ---------- */
  function evaluateRules(opp, text) {
    var t = String(text || '');
    var len = t.length;

    // 1. 吸引力：开头是否有钩子
    var hookWords = ['你知道吗', '千万别', '我发现', '说实话', '其实', '为什么', '没想到', '告诉你', '偷偷', '第一次', '结果'];
    var hasHook = hookWords.some(function (w) { return t.slice(0, 60).indexOf(w) >= 0; });
    var attraction = hasHook ? 78 : (len > 80 ? 65 : 52);

    // 2. 信息量：长度与结构
    var info = 50;
    if (len > 150) info += 15;
    if (len > 400) info += 10;
    if (/[一二三四五1-9]/.test(t)) info += 8;          // 有分点
    if ((t.match(/\n/g) || []).length >= 3) info += 8; // 有分段
    info = Math.min(info, 95);

    // 3. 情绪浓度
    var emoWords = ['后悔', '感动', '震惊', '崩溃', '开心', '焦虑', '治愈', '心疼', '愤怒', '惊喜', '绝了', '太难了'];
    var emoHits = emoWords.filter(function (w) { return t.indexOf(w) >= 0; }).length;
    var emotion = Math.min(50 + emoHits * 12, 95);

    // 4. 平台契合度：是否提到平台关键词
    var platform = opp && opp.platform ? opp.platform : '';
    var platformFit = 55;
    if (platform && t.indexOf(platform) >= 0) platformFit += 20;
    if (opp && opp.tags) {
      var tagHits = opp.tags.filter(function (tg) { return t.indexOf(tg) >= 0; }).length;
      platformFit += Math.min(tagHits * 6, 20);
    }
    platformFit = Math.min(platformFit, 95);

    // 5. 转化力：是否有行动引导
    var ctaWords = ['评论区', '关注我', '点赞', '收藏', '私信', '链接', '点击', '评论区留言', '免费领', '领取'];
    var ctaHits = ctaWords.filter(function (w) { return t.indexOf(w) >= 0; }).length;
    var conversion = Math.min(45 + ctaHits * 14, 95);

    var dims = [
      { key: 'attraction', name: '吸引力', score: attraction },
      { key: 'info', name: '信息量', score: info },
      { key: 'emotion', name: '情绪浓度', score: emotion },
      { key: 'platformFit', name: '平台契合', score: platformFit },
      { key: 'conversion', name: '转化力', score: conversion }
    ];
    var total = Math.round(dims.reduce(function (s, d) { return s + d.score; }, 0) / dims.length);

    var suggestions = [];
    if (!hasHook) suggestions.push('开头 60 字内加一个钩子（提问 / 反差 / 数字），前 3 秒决定去留');
    if (len < 150) suggestions.push('内容偏短，补充 1 个具体细节或案例，平台更喜欢「有信息量」的内容');
    if (emoHits < 2) suggestions.push('情绪浓度偏低，加入真实感受和具体场景，让读者有代入感');
    if (ctaHits === 0) suggestions.push('结尾加一句行动引导（如「评论区聊聊你的做法」），提升互动权重');
    if (platform && t.indexOf(platform) < 0) suggestions.push('正文里点出「' + platform + '」的平台特性（时长 / 画幅 / 话题），有助于推荐');

    var risks = [];
    if (/最|第一|绝对|100%|一定/.test(t)) risks.push('含绝对化用语（最/第一/绝对），部分平台会限流，建议改成「我试过」「大多数人」');
    if (/微信|vx|VX|\+我|私加/.test(t)) risks.push('含站外引流词，容易被限流，建议改成平台内合规表达');
    if (len > 1200) risks.push('篇幅偏长，建议拆成系列或删减冗余，完播率会更高');

    return {
      total: total,
      dimensions: dims,
      suggestions: suggestions,
      risks: risks,
      engine: 'local-rules',
      source: 'local',
      note: '本地规则引擎评估（无需联网）'
    };
  }

  function rewriteRules(text, style) {
    var t = String(text || '');
    var out = t;
    var tips = [];

    // 开头加钩子
    var firstLineEnd = t.indexOf('\n');
    var firstLine = firstLineEnd > 0 ? t.slice(0, firstLineEnd) : t.slice(0, 40);
    if (!/你知道吗|千万别|我发现|说实话|其实|为什么/.test(firstLine)) {
      out = '说实话，' + out;
      tips.push('已在开头加入口语化钩子');
    }
    // 绝对化词替换
    var before = out;
    out = out.replace(/最好/g, '我个人比较推荐').replace(/绝对/g, '基本').replace(/100%/g, '大部分情况');
    if (before !== out) tips.push('已替换绝对化用语，降低限流风险');
    // 结尾加引导
    if (!/评论区|关注|点赞|收藏/.test(out)) {
      out = out + '\n\n你怎么看？评论区聊聊。';
      tips.push('已补充结尾互动引导');
    }
    // 分段
    if ((out.match(/\n/g) || []).length < 3 && out.length > 200) {
      out = out.replace(/([。！？])/g, '$1\n');
      tips.push('已按句号分段，提升手机端可读性');
    }

    return {
      text: out,
      tips: tips,
      engine: 'local-rules',
      source: 'local',
      style: style || '口语化',
      note: '本地规则改写（不需要联网）'
    };
  }

  function conflictCheck(text) {
    var t = String(text || '');
    var issues = [];
    (t.match(/最|第一|绝对|100%|保证/g) || []).forEach(function (w) {
      issues.push({ word: w, type: '绝对化用语', level: '中' });
    });
    (t.match(/微信|vx|QQ|加我|私信我/g) || []).forEach(function (w) {
      issues.push({ word: w, type: '站外引流', level: '高' });
    });
    (t.match(/医疗|治病|药|投资|稳赚/g) || []).forEach(function (w) {
      issues.push({ word: w, type: '敏感领域', level: '高' });
    });
    return {
      ok: true,
      conflicts: issues,
      level: issues.length === 0 ? '安全' : (issues.some(function (i) { return i.level === '高'; }) ? '高风险' : '需注意'),
      source: 'local',
      note: '本地规则检测'
    };
  }

  function productize(opp) {
    if (!opp) return { ok: false, error: '机会不存在' };
    var tags = opp.tags || [];
    return {
      ok: true,
      plan: {
        title: (opp.title || '') + ' · 产品化方案',
        positioning: '面向' + (opp.platform || '内容平台') + '的' + (opp.type === 'flow' ? '流量分成' : '活动参与') + '内容',
        steps: [
          '第一步：拆解规则 —— 明确「' + (opp.title || '') + '」的参与门槛与结算方式',
          '第二步：选题 —— 结合你的账号定位，从 ' + tags.slice(0, 3).join(' / ') + ' 切入',
          '第三步：产出 —— 按期产出 3~5 条内容测试数据，择优放量',
          '第四步：复盘 —— 记录数据到工作台，沉淀为可复用经验'
        ],
        monetization: opp.reward || opp.prize || '详见活动规则',
        risk: (opp.deadline ? '截止时间：' + opp.deadline + '，请预留 2~3 天制作时间' : '关注平台规则变化')
      },
      source: 'local'
    };
  }

  function generateReport() {
    var opps = DB.opportunities || [];
    var recs = DB.records || [];
    var lessons = DB.lessons || [];

    var urgent = opps.filter(function (o) {
      if (!o.deadline) return false;
      var d = new Date(o.deadline).getTime() - Date.now();
      return d > 0 && d < 7 * 24 * 3600 * 1000;
    }).map(function (o) { return o.id; });

    var highPrize = opps.slice().sort(function (a, b) { return rewardValue(b) - rewardValue(a); })
      .slice(0, 5).map(function (o) { return o.id; });

    var doing = recs.filter(function (r) { return r.status === 'doing'; }).length;
    var done = recs.filter(function (r) { return r.status === 'done'; }).length;

    var report = {
      id: uid('rep'),
      createdAt: now(),
      headline: '本周共 ' + opps.length + ' 个机会，' + urgent.length + ' 个临近截止；你在进行中 ' + doing + ' 项、已完成 ' + done + ' 项',
      sample: {
        opportunities: opps.length,
        urgent: urgent.length,
        doing: doing,
        done: done,
        lessons: lessons.length
      },
      urgentIds: urgent,
      highPrizeIds: highPrize,
      advice: [
        urgent.length ? '优先处理 ' + urgent.length + ' 个临近截止的机会，别让选题在截止前一天才动工' : '本周暂无紧急截止，可从容安排选题',
        doing > 5 ? '进行中事项偏多（' + doing + ' 项），建议聚焦 2~3 项做出成绩' : '节奏合理，保持每周复盘一次',
        '把做过的高流量内容记成经验，下次同类选题直接复用结构'
      ]
    };

    DB.reports = DB.reports || [];
    DB.reports.unshift(report);
    save(DB);
    return { ok: true, report: report };
  }

  /* ---------- 路由分发 ---------- */
  function handle(path, options) {
    options = options || {};
    var method = (options.method || 'GET').toUpperCase();
    var body = options.body || {};
    var clean = String(path || '/').replace(/^\//, '');
    var qsIdx = clean.indexOf('?');
    var route = qsIdx >= 0 ? clean.slice(0, qsIdx) : clean;
    var params = new URLSearchParams(qsIdx >= 0 ? clean.slice(qsIdx + 1) : '');
    var seg = route.split('/');

    /* --- 基础 --- */
    if (route === 'health') {
      return { ok: true, status: 'ok', mode: 'offline', time: now() };
    }
    if (route === 'meta') {
      var opps = DB.opportunities || [];
      return {
        ok: true,
        counts: {
          all: opps.length,
          flow: opps.filter(function (o) { return o.type === 'flow'; }).length,
          prize: opps.filter(function (o) { return o.type === 'prize'; }).length,
          product: opps.filter(function (o) { return o.type === 'product'; }).length,
          sample: opps.filter(function (o) { return o.type === 'sample'; }).length,
          activity: opps.filter(function (o) { return o.type === 'activity'; }).length,
          lesson: (DB.lessons || []).length,
          record: (DB.records || []).length,
          content: (DB.contents || []).length,
          report: (DB.reports || []).length
        },
        mode: 'offline'
      };
    }

    /* --- 机会 --- */
    if (seg[0] === 'opportunities') {
      if (seg.length === 1) {
        var list = (DB.opportunities || []).slice();
        var type = params.get('type'), platform = params.get('platform');
        var keyword = params.get('keyword'), sort = params.get('sort');
        if (type && type !== 'all') list = list.filter(function (o) { return o.type === type; });
        if (platform && platform !== 'all') list = list.filter(function (o) { return o.platform === platform; });
        if (keyword) {
          var k = keyword.toLowerCase();
          list = list.filter(function (o) {
            return (o.title || '').toLowerCase().indexOf(k) >= 0 ||
              (o.summary || '').toLowerCase().indexOf(k) >= 0 ||
              (o.platform || '').toLowerCase().indexOf(k) >= 0 ||
              (o.tags || []).some(function (t) { return String(t).toLowerCase().indexOf(k) >= 0; });
          });
        }
        if (sort === 'deadline') {
          list.sort(function (a, b) { return String(a.deadline).localeCompare(String(b.deadline)); });
        } else if (sort === 'reward') {
          list.sort(function (a, b) { return rewardValue(b) - rewardValue(a); });
        }
        return { ok: true, total: list.length, list: list };
      }
      var item = (DB.opportunities || []).find(function (o) { return o.id === seg[1]; });
      if (!item) return { ok: false, error: '未找到该机会' };
      return { ok: true, item: item };
    }

    /* --- 经验 --- */
    if (seg[0] === 'lessons') {
      if (method === 'GET') {
        if (seg[1]) {
          var l = (DB.lessons || []).find(function (x) { return x.id === seg[1]; });
          if (!l) return { ok: false, error: '未找到该经验' };
          return { ok: true, item: l };
        }
        return { ok: true, total: (DB.lessons || []).length, list: DB.lessons || [] };
      }
      if (method === 'POST') {
        var nl = Object.assign({ id: uid('les'), createdAt: now() }, body);
        DB.lessons = DB.lessons || []; DB.lessons.unshift(nl); save(DB);
        return { ok: true, item: nl };
      }
      if (method === 'DELETE') {
        DB.lessons = (DB.lessons || []).filter(function (x) { return x.id !== seg[1]; }); save(DB);
        return { ok: true };
      }
    }

    /* --- 设置 --- */
    if (seg[0] === 'settings') {
      if (method === 'GET') return { ok: true, settings: DB.settings || {} };
      if (method === 'PUT') {
        DB.settings = Object.assign({}, DB.settings || {}, body); save(DB);
        return { ok: true, settings: DB.settings };
      }
    }

    /* --- 记录（我的进度） --- */
    if (seg[0] === 'records') {
      DB.records = DB.records || [];
      if (seg.length === 1 && method === 'GET') {
        return { ok: true, total: DB.records.length, list: DB.records };
      }
      if (seg.length === 1 && method === 'POST') {
        var nr = Object.assign({ id: uid('rec'), status: 'todo', createdAt: now() }, body);
        DB.records.unshift(nr); save(DB);
        return { ok: true, item: nr };
      }
      if (seg.length === 3 && seg[2] === 'checkin' && method === 'POST') {
        var r = DB.records.find(function (x) { return x.id === seg[1]; });
        if (!r) return { ok: false, error: '未找到该记录' };
        r.checkins = r.checkins || [];
        r.checkins.push({ at: now(), note: body.note || '' });
        r.lastCheckin = now();
        save(DB);
        return { ok: true, item: r };
      }
      if (seg.length === 2) {
        var idx = DB.records.findIndex(function (x) { return x.id === seg[1]; });
        if (idx < 0) return { ok: false, error: '未找到该记录' };
        if (method === 'PUT') {
          DB.records[idx] = Object.assign({}, DB.records[idx], body); save(DB);
          return { ok: true, item: DB.records[idx] };
        }
        if (method === 'DELETE') {
          DB.records.splice(idx, 1); save(DB);
          return { ok: true };
        }
      }
    }

    /* --- 内容库 --- */
    if (seg[0] === 'contents') {
      DB.contents = DB.contents || [];
      if (seg.length === 1 && method === 'GET') {
        return { ok: true, total: DB.contents.length, list: DB.contents };
      }
      if (seg.length === 1 && method === 'POST') {
        var nc = Object.assign({ id: uid('con'), createdAt: now() }, body);
        DB.contents.unshift(nc); save(DB);
        return { ok: true, item: nc };
      }
      if (seg.length === 2 && method === 'DELETE') {
        DB.contents = DB.contents.filter(function (x) { return x.id !== seg[1]; }); save(DB);
        return { ok: true };
      }
    }

    /* --- 周报 --- */
    if (seg[0] === 'reports') {
      if (seg.length === 1 && method === 'GET') {
        return { ok: true, total: (DB.reports || []).length, list: DB.reports || [] };
      }
      if (seg[1] === 'generate' && method === 'POST') {
        return generateReport();
      }
    }

    /* --- AI 能力（本地规则引擎） --- */
    if (seg[0] === 'ai') {
      if (seg[1] === 'config' && method === 'GET') {
        var st = DB.settings || {};
        return {
          ok: true,
          config: {
            provider: st.aiProvider || 'local',
            model: st.aiModel || '本地规则引擎',
            baseUrl: st.aiBaseUrl || '',
            enabled: false,
            providers: [
              { id: 'local', name: '本地规则引擎（内置，无需联网）' },
              { id: 'deepseek', name: 'DeepSeek' },
              { id: 'openai', name: 'OpenAI 兼容接口' }
            ]
          },
          mode: 'offline'
        };
      }
      if (seg[1] === 'config' && method === 'PUT') {
        DB.settings = Object.assign({}, DB.settings || {}, {
          aiProvider: body.provider, aiModel: body.model, aiBaseUrl: body.baseUrl, aiApiKey: body.apiKey
        });
        save(DB);
        return { ok: true };
      }
      if (seg[1] === 'evaluate' && method === 'POST') {
        var opp = (DB.opportunities || []).find(function (o) { return o.id === body.opportunityId; });
        if (!opp) return { ok: false, error: '机会不存在' };
        if (!body.text || !String(body.text).trim()) return { ok: false, error: '请先粘贴你的文案' };
        return { ok: true, evaluation: evaluateRules(opp, body.text) };
      }
      if (seg[1] === 'rewrite' && method === 'POST') {
        return { ok: true, rewritten: rewriteRules(body.text, body.style) };
      }
      if (seg[1] === 'conflict' && method === 'POST') {
        return { ok: true, result: conflictCheck(body.text) };
      }
      if (seg[1] === 'productize' && method === 'POST') {
        var o2 = (DB.opportunities || []).find(function (o) { return o.id === body.opportunityId; });
        return productize(o2);
      }
      if (seg[1] === 'test' && method === 'POST') {
        return { ok: true, result: { ok: false, message: '离线版使用内置规则引擎，无需外部 API' } };
      }
    }

    /* --- 邮件（离线不支持，明确告知） --- */
    if (seg[0] === 'mail') {
      if (seg[1] === 'config' && method === 'GET') {
        var s2 = DB.settings || {};
        var prov = s2.smtpProvider || 'qq';
        var PRESET_MAP = {
          qq:      { id: 'qq',      label: 'QQ 邮箱',    host: 'smtp.qq.com',        port: 465 },
          '163':   { id: '163',     label: '网易 163',   host: 'smtp.163.com',       port: 465 },
          '126':   { id: '126',     label: '网易 126',   host: 'smtp.126.com',       port: 465 },
          gmail:   { id: 'gmail',   label: 'Gmail',     host: 'smtp.gmail.com',     port: 465 },
          outlook: { id: 'outlook', label: 'Outlook',   host: 'smtp.office365.com', port: 587 },
          custom:  { id: 'custom',  label: '自定义 SMTP', host: '自定义',             port: 465 }
        };
        var presets = ['qq', '163', '126', 'gmail', 'outlook', 'custom'].map(function (k) { return PRESET_MAP[k]; });
        var cur = PRESET_MAP[prov] || PRESET_MAP.qq;
        return {
          ok: true,
          config: {
            enabled: false,
            to: s2.email || '',
            user: s2.smtpUser || '',
            provider: cur.id,
            providerLabel: cur.label,
            host: cur.host,
            port: cur.port,
            passSet: !!s2.smtpPassSet,
            presets: presets,
            help: '离线版不直接发信（发信需要服务器）。想自动收周报：在周报页点「导出/分享」，或把工作台装到主屏随时打开。'
          }
        };
      }
      if (seg[1] === 'config' && method === 'PUT') {
        DB.settings = DB.settings || {};
        var mb = body || {};
        if (mb.smtpUser != null) DB.settings.smtpUser = mb.smtpUser;
        if (mb.email != null) DB.settings.email = mb.email;
        if (mb.smtpProvider != null) DB.settings.smtpProvider = mb.smtpProvider;
        if (mb.smtpPass) DB.settings.smtpPassSet = true;
        save(DB);
        return { ok: true };
      }
      if (seg[1] === 'test' || seg[1] === 'send-report') {
        return { ok: false, error: '离线版不支持发送邮件（邮件需要服务器）；周报可在此页面直接查看' };
      }
    }

    /* --- 调试 --- */
    if (route === 'debug/storage') {
      return { ok: true, mode: 'offline', storage: 'localStorage', bytes: (localStorage.getItem(LS_KEY) || '').length };
    }

    return { ok: false, error: '离线版暂不支持该接口：' + route };
  }

  /* ---------- 对外接口（替代 fetch） ---------- */
  window.AIMAMA_LOCAL_API = function (path, options) {
    return new Promise(function (resolve, reject) {
      // 轻微延迟，模拟网络请求，让 UI 的 loading 状态正常
      setTimeout(function () {
        try {
          var data = handle(path, options);
          if (!data.ok && data.error && !/暂不支持/.test(data.error)) {
            var err = new Error(data.error);
            err.business = true;
            err.payload = data;
            return reject(err);
          }
          resolve(data);
        } catch (e) {
          reject(e);
        }
      }, 60);
    });
  };

  /* ---------- 数据备份 / 恢复 ---------- */
  window.AIMAMA_EXPORT = function () {
    var blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'AI妈妈-数据备份-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
  };

  window.AIMAMA_IMPORT = function (file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        DB = d; save(DB);
        cb && cb(true);
      } catch (e) { cb && cb(false, e.message); }
    };
    reader.readAsText(file);
  };

  window.AIMAMA_RESET = function () {
    DB = defaultData(); save(DB);
  };

  console.log('%c🤖 AI妈妈 离线版已就绪', 'color:#e91e63;font-weight:bold', '\n数据保存在本机浏览器，不上传任何服务器');
})();

</script>
</head>

async function api(path, options = {}) {
  if (window.AIMAMA_LOCAL_API) {
    try {
      return await window.AIMAMA_LOCAL_API(path, options);
    } catch (e) {
      if (e && e.business) throw e;
      console.error('[AI妈妈] 本地接口错误', path, e);
      throw new Error('本地数据处理出错：' + (e.message || '未知错误'));
    }
  }
  return demoApi(path, options);
}

function demoApi(path, options = {}) {
  const [route, qs] = path.replace(/^\//, '').split('?');
  const params = new URLSearchParams(qs || '');
  const body = options.body || {};
  const S = DEMO_STATE;

  if (route === 'meta') {
    const counts = { all:DEMO_OPPS.length,
      flow:DEMO_OPPS.filter(o=>o.type==='flow').length,
      prize:DEMO_OPPS.filter(o=>o.type==='prize').length,
      product:DEMO_OPPS.filter(o=>o.type==='product').length,
      sample:DEMO_OPPS.filter(o=>o.type==='sample').length };
    return Promise.resolve({ ok:true, platforms:[...new Set(DEMO_OPPS.map(o=>o.platform))], counts });
  }
  if (route === 'opportunities') {
    let list = DEMO_OPPS.slice();
    const q = Object.fromEntries(params);
    if (q.type && q.type!=='all') list = list.filter(o=>o.type===q.type);
    if (q.platform && q.platform!=='all') list = list.filter(o=>o.platform===q.platform);
    if (q.keyword) { const k=q.keyword.toLowerCase(); list=list.filter(o=>(o.title+o.summary+o.platform+(o.tags||[]).join()).toLowerCase().includes(k)); }
    if (q.sort==='deadline') list.sort((a,b)=>a.deadline.localeCompare(b.deadline));
    if (q.sort==='reward') list.sort((a,b)=>rewardValue(b)-rewardValue(a));
    return Promise.resolve({ ok:true, total:list.length, list });
  }
  if (route.startsWith('opportunities/')) {
    const item = DEMO_OPPS.find(o=>o.id===route.split('/')[1]);
    return item ? Promise.resolve({ ok:true, item }) : Promise.reject(new Error('未找到该机会'));
  }
  if (route === 'settings') {
    if (options.method === 'PUT') {
      Object.assign(S.settings, body);
      try{ localStorage.setItem('aimama_demo_settings', JSON.stringify(S.settings)); }catch(e){}
    }
    return Promise.resolve({ ok:true, settings:S.settings });
  }
  if (route === 'records') {
    if (options.method === 'POST') {
      const opp = DEMO_OPPS.find(o=>o.id===body.opportunityId);
      if (!opp) return Promise.reject(new Error('机会不存在'));
      const rec = { id:'rec-'+Date.now().toString(36), opportunityId:opp.id, kind:body.kind||(opp.type==='prize'?'submission':'signup'), title:opp.title, platform:opp.platform, type:opp.type, deadline:opp.deadline, status:'ongoing', draft:body.draft||'', createdAt:nowISO() };
      S.records.unshift(rec);
      return Promise.resolve({ ok:true, record:rec });
    }
    return Promise.resolve({ ok:true, list:S.records });
  }
  if (route.startsWith('records/')) {
    const id = route.split('/')[1];
    if (options.method === 'PUT') {
      const rec = S.records.find(r=>r.id===id);
      if (!rec) return Promise.reject(new Error('记录不存在'));
      Object.assign(rec, body);
      return Promise.resolve({ ok:true, record:rec });
    }
    if (options.method === 'DELETE') {
      S.records = S.records.filter(r=>r.id!==id);
      return Promise.resolve({ ok:true });
    }
  }
  if (route === 'reports') return Promise.resolve({ ok:true, list:S.reports });
  if (route === 'reports/generate') {
    const d = new Date();
    const week = d.getFullYear()+'-W'+String(getWeekNumber(d)).padStart(2,'0');
    const urgent = DEMO_OPPS.filter(o=>daysLeft(o.deadline)>=0&&daysLeft(o.deadline)<=14).sort((a,b)=>daysLeft(a.deadline)-daysLeft(b.deadline));
    const high = DEMO_OPPS.filter(o=>o.type==='prize').sort((a,b)=>rewardValue(b)-rewardValue(a)).slice(0,3);
    const rep = { id:'rp-'+Date.now().toString(36), week, createdAt:nowISO(),
      totalCount:DEMO_OPPS.length,
      counts:{ flow:DEMO_OPPS.filter(o=>o.type==='flow').length, prize:DEMO_OPPS.filter(o=>o.type==='prize').length, product:DEMO_OPPS.filter(o=>o.type==='product').length },
      urgentIds:urgent.slice(0,6).map(o=>o.id), highPrizeIds:high.map(o=>o.id),
      headline:(urgent.length?urgent.length+' 个机会即将截稿，':'')+'最高奖金 '+(rewardValue(high[0])||0)+' 元',
      aiComment:'姐妹，'+(urgent.length?'有 '+urgent.length+' 个活动快截止了，先处理这些；':'')+'「'+(high[0]?high[0].title:'无')+'」奖金最高，值得优先考虑。' };
    S.reports.unshift(rep);
    return Promise.resolve({ ok:true, report:rep });
  }
  if (route === 'ai/evaluate') {
    if (!body.text || !String(body.text).trim()) return Promise.reject(new Error('请先粘贴你的文案'));
    const opp = DEMO_OPPS.find(o=>o.id===body.opportunityId);
    if (!opp) return Promise.reject(new Error('机会不存在'));
    return Promise.resolve({ ok:true, evaluation: evaluateFit(opp, String(body.text)) });
  }
  if (route === 'ai/rewrite') {
    if (!body.text || !String(body.text).trim()) return Promise.reject(new Error('请先粘贴你的文案'));
    const opp = DEMO_OPPS.find(o=>o.id===body.opportunityId);
    if (!opp) return Promise.reject(new Error('机会不存在'));
    return Promise.resolve({ ok:true, rewritten: rewriteFor(opp, String(body.text)) });
  }
  if (route === 'ai/productize') {
    if (!body.text || !String(body.text).trim()) return Promise.reject(new Error('请先粘贴你的文案'));
    return Promise.resolve({ ok:true, analysis: analyzeProductize(String(body.text)) });
  }
  if (route === 'ai/conflict') {
    const opp = DEMO_OPPS.find(o=>o.id===body.opportunityId) || null;
    const conflicts=[];
    if (opp && /首发|未发布|独家/.test((opp.requirement||'')+(opp.reviewDimensions||''))) {
      conflicts.push({ type:'first_release', message:'「'+opp.title+'」要求首发/未发布，若你同时把内容发到其他平台或上架售卖，可能失去资格' });
    }
    return Promise.resolve({ ok:true, conflicts:conflicts, risks:[], tip:'', source:'rule', engine:'本地规则引擎' });
  }
  if (route === 'ai/config') {
    if (options.method === 'PUT') {
      const b = body || {};
      if (b.aiProvider) S.aiConfig.provider = b.aiProvider;
      if (b.aiBaseUrl) S.aiConfig.baseUrl = b.aiBaseUrl;
      if (b.aiModel) S.aiConfig.model = b.aiModel;
      if (b.aiApiKey) S.aiConfig.key = b.aiApiKey;
      if (b.clearKey) S.aiConfig.key = '';
      try{ localStorage.setItem('aimama_demo_aiconfig', JSON.stringify(S.aiConfig)); }catch(e){}
    }
    return Promise.resolve({ ok:true, config: demoAiConfig() });
  }
  if (route === 'ai/test') {
    return Promise.resolve({ ok:false, result:{ ok:false, error:'演示模式（直接打开 HTML 文件）无法连接模型。请通过 node server.js 启动后再配置。' } });
  }
  if (route === 'mail/config') {
    if (options.method === 'PUT') {
      const b = body || {};
      if (b.smtpUser) S.mailConfig.user = b.smtpUser;
      if (b.email) S.mailConfig.to = b.email;
      if (b.smtpPass) S.mailConfig.passSet = true;
      if (b.smtpProvider) S.mailConfig.provider = b.smtpProvider;
      try{ localStorage.setItem('aimama_demo_mailconfig', JSON.stringify(S.mailConfig)); }catch(e){}
    }
    return Promise.resolve({ ok:true, config: demoMailConfig() });
  }
  if (route === 'mail/test' || route === 'mail/send-report') {
    return Promise.reject(new Error('演示模式无法真正发信。请通过 node server.js 启动后再配置邮箱。'));
  }
  if (route === 'contents') return Promise.resolve({ ok:true, list:S.contents });
  if (route === 'lessons') {
    let list = DEMO_LESSONS.slice();
    const tp = params.get('topic'), kw = params.get('keyword');
    if (tp && tp !== 'all') list = list.filter(l => l.topic === tp);
    if (kw) { const k = kw.toLowerCase(); list = list.filter(l => (l.title+l.summary+(l.keyPoints||[]).join('')).toLowerCase().includes(k)); }
    return Promise.resolve({ ok:true, total:list.length, topics:[...new Set(DEMO_LESSONS.map(l=>l.topic))], list });
  }
  return Promise.reject(new Error('接口不存在'));
}

/* ---------------- 工具 ---------------- */
function rewardValue(o) { const m=String(o.reward||'').match(/(\d[\d,]*)/); return m?parseInt(m[1].replace(/,/g,''),10)||0:0; }
function daysLeft(deadline) { if(!deadline) return 9999; const d=new Date(deadline+'T23:59:59'); return Math.ceil((d-new Date())/86400000); }
function typeName(t){ return {flow:'流量分成',prize:'投稿评奖',product:'产品上架',sample:'免费申样'}[t]||t; }
function typeBadgeClass(t){ return {flow:'badge-flow',prize:'badge-prize',product:'badge-product',sample:'badge-sample'}[t]; }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getWeekNumber(d){ const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dayNum=date.getUTCDay()||7; date.setUTCDate(date.getUTCDate()+4-dayNum); const y=new Date(Date.UTC(date.getUTCFullYear(),0,1)); return Math.ceil(((date-y)/86400000+1)/7); }
function toast(msg, ms) {
  const t=$('#toast'); ms=ms||2200; t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.add('hidden'),ms);
}

/* ---------------- 数据新鲜度横幅 ---------------- */
function renderFreshBanner(){
  const el=document.getElementById('freshBanner');
  if(!el) return;
  const seedUpdated=(window.__AIMAMA_SEED__&&window.__AIMAMA_SEED__.dataUpdatedAt)||'';
  // 用日期字符串直接比对（避免时区导致「今天」判断失效）
  function ymd(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
  function hm(str){ const m=/T(\d{2}):(\d{2})/.exec(str||''); return m?(m[1]+':'+m[2]):''; }
  let label='今天';
  if(seedUpdated){
    const now=new Date();
    const seedDay=String(seedUpdated).slice(0,10);   // YYYY-MM-DD（已含 +08:00 的本地日期）
    const todayStr=ymd(now);
    const yObj=new Date(now.getTime()-86400000);
    const yesterdayStr=ymd(yObj);
    if(seedDay===todayStr) label='今天 '+hm(seedUpdated);
    else if(seedDay===yesterdayStr) label='昨天 '+hm(seedUpdated);
    else { const p=seedDay.split('-'); label=parseInt(p[1])+'月'+parseInt(p[2])+'日'; }
  }
  const list=(window.__AIMAMA_SEED__&&window.__AIMAMA_SEED__.opportunities)||[];
  const soon=list.filter(function(o){const n=daysLeft(o.deadline);return n>=0&&n<=21;}).length;
  el.innerHTML='<span class="dot"></span><span class="txt">机会数据更新于 <b>'+label+'</b> · 共 <b>'+list.length+'</b> 条 · <b>'+soon+'</b> 条 21 天内截止</span><span class="refresh" id="freshRefresh">↻ 检查更新</span>';
  const btn=document.getElementById('freshRefresh');
  if(btn) btn.onclick=function(){
    btn.textContent='↻ 检查中…';
    setTimeout(function(){
      btn.textContent='✓ 已是最新';
      setTimeout(function(){ btn.textContent='↻ 检查更新'; },1800);
    },900);
  };
}function emptyHtml(emoji,txt){ return '<div class="empty"><div class="emoji">'+emoji+'</div><div class="txt">'+escapeHtml(txt)+'</div></div>'; }
function bindCards(){ $$('.card[data-id]').forEach(c=>c.onclick=()=>openDetail(c.dataset.id)); }

async function openDetail(id) {
  showPage(skeleton(3));
  try {
    const data=await api('/opportunities/'+id);
    const o=data.item;
    STATE.currentOpp=o;
    const dl=daysLeft(o.deadline);
    const rows=[];
    rows.push(kv('平台',escapeHtml(o.platform)));
    rows.push(kv('类型',typeName(o.type)));
    rows.push(kv('收益',escapeHtml(o.reward)));
    if (o.priceRange) rows.push(kv('参考定价',escapeHtml(o.priceRange)));
    // 门槛：兼容字符串（旧）与对象（新，申样类）
    if (o.threshold) {
      if (typeof o.threshold === 'object') {
        const parts = [];
        if (o.threshold.fansMin) parts.push('粉丝 ≥ '+o.threshold.fansMin);

        if (o.threshold.credit && o.threshold.credit !== '—') parts.push('口碑分 ≥ '+o.threshold.credit);
        rows.push(kv('申请门槛', parts.length ? escapeHtml(parts.join(' · ')) : '基本无门槛'));
      } else {
        rows.push(kv('门槛',escapeHtml(o.threshold)));
      }
    }
    rows.push(kv('要求',escapeHtml(o.requirement)));
    if (o.reviewDimensions) rows.push(kv('评审维度',escapeHtml(o.reviewDimensions)));
    rows.push(kv('截止',(o.deadline||'长期有效')+(dl<9000?'<span class="'+(dl<=7?'days-urgent':'')+'">（剩 '+dl+' 天）</span>':'')));

    showPage(
      '<button class="back-btn" onclick="nav(\'list\')">‹ 返回列表</button>'+
      '<div class="detail-head">'+
        '<div class="card-top">'+
          '<span class="platform">'+escapeHtml(o.platform)+'</span>'+
          '<span class="badge '+typeBadgeClass(o.type)+'">'+typeName(o.type)+'</span>'+

        '<div class="detail-title">'+escapeHtml(o.title)+'</div>'+

      '<div class="detail-block"><h3>活动说明</h3><p>'+escapeHtml(o.summary)+'</p></div>'+
      '<div class="detail-block"><h3>关键信息</h3>'+rows.join('')+'</div>'+
      '<div class="detail-block"><h3>信息来源</h3>'+
        kv('链接','<a href="'+escapeHtml(o.sourceUrl)+'" target="_blank" rel="noopener">'+escapeHtml(o.sourceUrl)+'</a>')+
        kv('更新于',new Date(o.updatedAt).toLocaleString('zh-CN'))+
        kv('可信度',o.confidence==='official'?'✓ 官方公开信息':'⚠ 待确认，建议去后台核实')+
      '</div>'+
      '<div id="conflictBox"></div>'+
      (o.type==='sample' ? '<div id="sampleCheck"></div>' : '')+

      '<button class="btn btn-ghost" id="toolBtn"></button>'+
      '<button class="btn btn-ghost" id="sourceBtn">🔗 去官方页面自行操作</button>'+
      '<div class="note">妈妈不会代你登录或代你提交，所有提交动作都由你本人在官方页面完成。</div>'
    );
    const actBtn=$('#actBtn');
    // 主按钮：参加并打卡（四种类型统一入口）
    actBtn.textContent='✍️ 参加并打卡';
    if (o.type==='flow') actBtn.onclick=()=>startSignup(o);
    else actBtn.onclick=()=>quickCheckin(o);
    // 次按钮：该类型的专属工具
    const toolBtn=$('#toolBtn');
    if (o.type==='prize') { toolBtn.textContent='📝 先评估我的文案获奖胜算'; toolBtn.onclick=()=>openEvaluate(o.id); }
    else if (o.type==='product') { toolBtn.textContent='💡 先分析能否做成付费产品'; toolBtn.onclick=()=>openProductize(o.id); }    else if (o.type==='sample') { toolBtn.textContent='📋 查看申样材料清单'; toolBtn.onclick=()=>startSignup(o); }

async function checkConflict(o) {
  try {
    const data=await api('/records');
    const active=data.list.filter(r=>r.status!=='ended');
    const conflicts=[];
    for (const r of active) {
      if (r.opportunityId===o.id) continue;
      try {
        const d2=await api('/opportunities/'+r.opportunityId);
        if (/首发|未发布|独家/.test((d2.item.requirement||'')+(d2.item.reviewDimensions||''))) conflicts.push(d2.item);
      } catch(e){}
    }
    const needsFirst=/首发|未发布|独家/.test((o.requirement||'')+(o.reviewDimensions||''));
    let html='';
    if (needsFirst) html+='<div class="warn-box">🚨 <b>首发提醒</b><br>这个活动要求<b>首发 / 未发布</b>。妈妈提醒：别把这篇内容先发到其他平台，否则可能失去资格。</div>';
    if (conflicts.length) html+='<div class="warn-box">🚨 <b>冲突提醒</b><br>你已参加的「'+escapeHtml(conflicts[0].title)+'」要求首发/未发布。同一份内容不要多渠道使用，妈妈先帮你盯着。</div>';
    const box=$('#conflictBox');
    if (box) box.innerHTML=html;
  } catch(e){}
}

function engineBadge(source, engine, reason) {

  }

}
function renderEvaluation(ev,text,id) {
  const bars=ev.items.map(it=>
    '<div class="score-row">'+
      '<div class="score-name">'+escapeHtml(it.name)+'</div>'+
      '<div class="score-bar"><div class="score-fill" style="width:0%" data-w="'+it.score+'"></div></div>'+
      '<div class="score-val">'+it.score+'</div>'+
    '</div>'+
    '<div class="score-note">'+escapeHtml(it.note)+'</div>'
  ).join('');
  const sug=ev.suggestions.map(s=>kv('•',escapeHtml(s))).join('');
  const risk=ev.risks.map(s=>kv('⚠️',escapeHtml(s))).join('');
  $('#evalResult').innerHTML=

function animateScore(target) {
  const el=$('#scoreNum'); if (!el) return;
  const dur=900, start=performance.now();
  function step(t) {
    const p=Math.min(1,(t-start)/dur);
    const eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*eased);
    if (p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function normPlatform(p){
  const s=String(p||'');
  if(/小红书/.test(s)) return '小红书';
  if(/抖音/.test(s)) return '抖音';
  if(/公众号|微信/.test(s)) return '微信公众号';
  if(/快手/.test(s)) return '快手';
  if(/B站|bilibili/i.test(s)) return 'B站';
  return s||'其他';
}
function platIcon(p){
  return {'小红书':'📕','抖音':'🎵','B站':'📺','微信公众号':'💬','快手':'⚡'}[p]||'🌐';
}

/* ---------------- 记录（打卡进度看板） ---------------- */
// 状态机定义（按机会类型给不同的阶段名）
const STEP_FLOW = [
  { k:'checked_in', t:'已报名' },
  { k:'published',  t:'已发布' },
  { k:'earning',    t:'产生收益' },
  { k:'done',       t:'已完成' }
];
const STEP_PRIZE = [
  { k:'checked_in', t:'已投稿' },
  { k:'reviewing',  t:'评审中' },
  { k:'rewarded',   t:'已获奖' },
  { k:'done',       t:'已完成' }
];
const STEP_PRODUCT = [
  { k:'checked_in', t:'已准备' },
  { k:'listed',     t:'已上架' },
  { k:'earning',    t:'已出单' },
  { k:'done',       t:'已完成' }
];
function stepsFor(type) {
  if (type==='prize') return STEP_PRIZE;
  if (type==='product') return STEP_PRODUCT;
  return STEP_FLOW;
}
const STATUS_LABEL = {
  checked_in:'已参加', published:'已发布', reviewing:'评审中',
  rewarded:'已获奖', earning:'有收益', listed:'已上架', done:'已完成',
  // 兼容旧数据
  ongoing:'进行中', submitted:'已投稿', won:'已中奖', ended:'已结束'
};
const STATUS_CLS = {
  checked_in:'status-ongoing', published:'status-submitted', reviewing:'status-submitted',
  rewarded:'status-won', earning:'status-won', listed:'status-submitted', done:'status-ended',
  ongoing:'status-ongoing', submitted:'status-submitted', won:'status-won', ended:'status-ended'
};
// 生成进度步骤条
function renderSteps(r) {
  const steps = stepsFor(r.type);
  const cur = steps.findIndex(s => s.k === r.status);
  // 旧状态映射到新状态的位置
  let curIdx = cur;
  if (curIdx < 0) {
    const legacy = { ongoing:0, submitted:1, won:2, ended:3 };
    curIdx = legacy[r.status] !== undefined ? legacy[r.status] : 0;
  }
  return '<div class="rec-steps">'+ steps.map((s,i)=>{
    const cls = i < curIdx ? 'done' : (i === curIdx ? 'cur' : '');
    return '<div class="rec-step '+cls+'">'+
      '<div class="dot">'+(i < curIdx ? '✓' : (i===curIdx?'●':''))+'</div>'+
      '<div class="lbl">'+s.t+'</div>'+
    '</div>';
  }).join('') +'</div>';
}
// 生成成果数字卡（按类型显示不同指标）
function renderMetrics(r) {
  const m = r.metrics || {};
  const cards = [];
  const money = v => '¥'+Number(v).toLocaleString('zh-CN');
  const num = v => Number(v).toLocaleString('zh-CN');
  if (r.type === 'flow') {
    if (m.views != null) cards.push(['mv','', num(m.views), '播放 / 阅读']);
    if (m.income != null) cards.push(['mv hi','', money(m.income), '累计收益']);
  } else if (r.type === 'prize') {
    if (m.prize != null) cards.push(['mv hi','', money(m.prize), '获得奖金']);
    if (m.income != null) cards.push(['mv','', money(m.income), '其他收益']);
  } else {
    if (m.sales != null) cards.push(['mv','', num(m.sales), '销量']);
    if (m.revenue != null) cards.push(['mv hi','', money(m.revenue), '销售额']);
  }
  // 通用：收益兜底
  if (!cards.length && m.income != null) cards.push(['mv hi','', money(m.income), '收益']);
  if (!cards.length) return '';
  return '<div class="rec-metrics">'+ cards.map(c=>
    '<div class="rec-metric"><div class="'+c[0]+' '+c[1]+'">'+c[2]+'</div><div class="ml">'+c[3]+'</div></div>'
  ).join('') +'</div>';
}

function openCheckin(id) {
  const r=window._records.find(x=>x.id===id);
  if (!r) return;
  const steps = stepsFor(r.type);
  const m = r.metrics || {};
  // 根据机会类型决定展示哪些成果字段
  let metricFields = '';
  const f = (key,label,ph) => '<label>'+label+'</label><input type="number" min="0" step="0.01" id="ci_'+key+'" placeholder="'+ph+'" value="'+(m[key]!=null?m[key]:'')+'">';
  if (r.type==='flow') {
    metricFields = f('views','播放量 / 阅读量','例如 12000') + f('income','累计收益（元）','例如 86.5');
  } else if (r.type==='prize') {
    metricFields = f('prize','获得奖金（元）','未获奖可留空') + f('income','其他收益（元）','选填');
  } else {
    metricFields = f('sales','销量（件 / 份）','例如 12') + f('revenue','销售额（元）','例如 588');
  }
  showModal(
    '<h3>打卡更新</h3>'+
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:4px">'+escapeHtml(r.title)+'</div>'+
    '<div class="ci-form">'+
      '<label>当前进度</label>'+
      '<div class="ci-status-grid" id="ciStatus">'+
        steps.map(s=>'<div class="st-chip'+(s.k===r.status?' on':'')+'" data-k="'+s.k+'">'+s.t+'</div>').join('')+
      '</div>'+
      metricFields+
      '<label>备注（选填）</label>'+
      '<input type="text" id="ci_note" placeholder="例如：已发布，等数据" value="'+escapeHtml(r.note||'')+'">'+
    '</div>'+
    '<button class="btn" id="ciSave" style="margin-top:16px">保存打卡</button>'+
    '<button class="btn btn-ghost" onclick="closeModal()">取消</button>'
  );
  // 状态选择交互
  let picked = r.status;
  $$('#ciStatus .st-chip').forEach(chip=>{
    chip.onclick=()=>{
      picked = chip.dataset.k;
      $$('#ciStatus .st-chip').forEach(c=>c.classList.remove('on'));
      chip.classList.add('on');
    };
  });
  $('#ciSave').onclick=async()=>{
    const body = {
      status: picked,
      metrics: {
        views: $('#ci_views') ? $('#ci_views').value : null,
        income: $('#ci_income') ? $('#ci_income').value : null,
        prize: $('#ci_prize') ? $('#ci_prize').value : null,
        sales: $('#ci_sales') ? $('#ci_sales').value : null,
        revenue: $('#ci_revenue') ? $('#ci_revenue').value : null
      },
      note: $('#ci_note').value.trim()
    };
    try {
      await api('/records/'+id+'/checkin',{method:'POST',body:body});
      closeModal(); toast('打卡成功 ✅'); loadRecords();
    } catch(e) { toast(e.message||'打卡失败'); }
  };
}
// 打卡历史
function viewHistory(id) {
  const r=window._records.find(x=>x.id===id);
  if (!r) return;
  const hist = r.checkins || [];
  if (!hist.length) { showModal('<h3>打卡记录</h3><p style="color:var(--text-dim);font-size:13px">还没有打卡记录。</p><button class="btn btn-ghost" onclick="closeModal()">关闭</button>'); return; }
  const money=v=>'¥'+Number(v).toLocaleString('zh-CN');
  const rows = hist.map(h=>{
    const parts=[];
    if (h.metrics) {
      if (h.metrics.views!=null) parts.push('播放 '+h.metrics.views);
      if (h.metrics.income!=null) parts.push('收益 '+money(h.metrics.income));
      if (h.metrics.prize!=null) parts.push('奖金 '+money(h.metrics.prize));

/* ---------------- 本地 AI 引擎（与服务器同逻辑，预览模式兜底） ---------------- */
function evaluateFit(opp, text) {
  const items=[]; const len=text.replace(/\s/g,'').length;
  let lenScore=70, lenNote='当前约 '+len+' 字，活动未明确字数要求，按通用标准评估';
  const reqStr=(opp.requirement||'')+(opp.reviewDimensions||'');
  const rangeMatch=reqStr.match(/(\d+)\s*[~～\-到]\s*(\d+)\s*字/);
  const singleMatch=reqStr.match(/(\d+)\s*字/);
  if (rangeMatch) {
    const lo=+rangeMatch[1], hi=+rangeMatch[2];
    if (len>=lo&&len<=hi){ lenScore=100; lenNote='约 '+len+' 字，落在要求区间 '+lo+'~'+hi+' 字内 ✓'; }
    else if (len<lo){ lenScore=Math.max(30,100-Math.round((lo-len)/lo*100)); lenNote='约 '+len+' 字，比要求的 '+lo+' 字少了 '+(lo-len)+' 字，建议扩充'; }
    else { lenScore=Math.max(40,100-Math.round((len-hi)/hi*60)); lenNote='约 '+len+' 字，超出上限 '+hi+' 字，建议精简'; }
  } else if (singleMatch && +singleMatch[1]>=100) {
    const t=+singleMatch[1];
    if (len>=t*0.8){ lenScore=95; lenNote='约 '+len+' 字，满足要求（≥'+t+' 字）✓'; }
    else { lenScore=55; lenNote='约 '+len+' 字，未达到要求的 '+t+' 字，建议补足'; }
  }
  items.push({name:'篇幅 / 字数要求',score:lenScore,note:lenNote});
  const themeM=(opp.title||'').match(/[「《【]([^」》】]+)[」》】]/);
  const theme=themeM?themeM[1]:'';
  const kwScore=(theme&&text.indexOf(theme)>=0)?95:(len>100?70:60);
  items.push({name:'题材 / 主题契合',score:kwScore,note:theme?(text.indexOf(theme)>=0?'文案中出现了主题词「'+theme+'」，契合度高 ✓':'文案中未明显出现主题词「'+theme+'」，建议在标题或开头点题'):'该活动无明确主题词，按通用契合度评估'});
  const needsFirst=/首发|未发布|独家/.test(reqStr);
  items.push({name:'原创 / 首发风险',score:needsFirst?65:90,note:needsFirst?'该活动要求「首发 / 未发布」，请确认此文未在其他平台发布过 ⚠':'未检测到首发冲突信息'});
  let sScore=60; const sn=[];
  if (/[？?]|如何|怎么|\d+个|\d+种|^第/.test(text.slice(0,40))){ sScore+=15; sn.push('开头有钩子'); }
  if (len>300){ sScore+=10; sn.push('内容有展开'); }
  if (/总结|最后|综上|希望|建议/.test(text.slice(-200))){ sScore+=15; sn.push('有收尾'); }
  items.push({name:'结构完整度',score:Math.min(100,sScore),note:sn.length?'检测到：'+sn.join('、'):'结构较平，建议加开头钩子与结尾总结'});
  let dScore=70, dNote='活动未公开评审维度，按通用标准评估';
  if (opp.reviewDimensions){ dScore=75; dNote='该活动评审维度：'+opp.reviewDimensions+'。请对照自查是否覆盖了权重最高的那一项'; }
  items.push({name:'评审维度覆盖',score:dScore,note:dNote});
  const total=Math.round(items[0].score*.2+items[1].score*.25+items[2].score*.2+items[3].score*.2+items[4].score*.15);
  const verdict=total>=85?'推荐投稿（胜算较高）':total>=70?'可以投稿，建议按建议优化后再投':total>=55?'谨慎投稿，需较大修改':'不建议直接投稿，建议重写或换活动';
  const suggestions=items.filter(it=>it.score<85).map(it=>'【'+it.name+'】'+it.note);
  if (!suggestions.length) suggestions.push('各项要求均达标，整体质量不错，可微调细节后直接投稿。');
  const risks=[];
  if (needsFirst) risks.push('该活动要求首发/未发布，切勿先在别处发布，否则可能失去资格。');
  if (len<300&&opp.type==='prize') risks.push('篇幅偏短，部分评审看内容厚度，建议适当扩充。');
  if (!risks.length) risks.push('未发现明显硬伤。');
  return { opportunityId:opp.id, opportunityTitle:opp.title, platform:opp.platform, total:total, verdict:verdict, items:items, suggestions:suggestions, risks:risks, evaluatedAt:nowISO(),
    disclaimer:'评估基于活动公开要求与文案文本特征的匹配度计算，为参考性意见，不代表最终评选结果。' };
}
function rewriteFor(opp, text) {
  const themeM=(opp.title||'').match(/[「《【]([^」》】]+)[」》】]/);
  const theme=themeM?themeM[1]:'';
  const reqStr=(opp.requirement||'')+(opp.reviewDimensions||'');
  const rm=reqStr.match(/(\d+)\s*[~～\-到]\s*(\d+)\s*字/);
  const lo=rm?+rm[1]:null, hi=rm?+rm[2]:null;
  let out=text.trim();
  const lines=out.split('\n');
  const firstLine=lines[0]||'';
  const hooks=['我用亲身经历告诉你：','真实复盘：','3 个月实战总结：','别再踩坑了，'];
  const hook=hooks[Math.floor(Math.random()*hooks.length)];
  const newTitle=(theme&&firstLine.indexOf(theme)<0)?(hook+'关于「'+theme+'」，我想说的都在这里'):(hook+firstLine);
  out=newTitle+'\n\n'+lines.slice(1).join('\n').trim();
  if (theme&&out.indexOf(theme)<0) out=out.replace(/\n\n/,'\n\n今天想聊聊「'+theme+'」这个话题。\n\n');
  const cur=out.replace(/\s/g,'').length;
  if (lo&&cur<lo) {
    const filler='\n\n补充一点细节：'+(theme?'在「'+theme+'」这件事上，':'')+'我实际操作时还注意到一个容易被忽略的点——很多人失败不是因为方法不对，而是执行节奏乱了。我的做法是把它拆成小步骤，每完成一步就复盘一次，这样即使中间卡住也能快速调整。这部分经验对我帮助很大，希望对看到这里的你也有用。';
    out+=filler.repeat(Math.max(1,Math.ceil((lo-cur)/filler.replace(/\s/g,'').length)));
  } else if (hi&&cur>hi) {
    const cut=Math.ceil((cur-hi)/cur*out.length);
    out=out.slice(0,out.length-cut)+'……';
  }
  if (!/欢迎|评论|关注|点赞|收藏/.test(out.slice(-200))) out+='\n\n如果你也在'+(theme?'「'+theme+'」':'')+'这件事上摸索，欢迎在评论区聊聊你的经历，我会一条条回复。觉得有用的话，点个赞让更多人看到。';
  return out;
}
function analyzeProductize(text) {
  const len=text.replace(/\s/g,'').length;
  const isHowTo=/如何|怎么|教程|方法|步骤|经验|复盘|实战/.test(text);
  const hasData=/\d+%|\d+倍|\d+个月|\d+天|月入|收入/.test(text);
  const potential=Math.min(95,40+(isHowTo?25:0)+(hasData?20:0)+Math.min(15,Math.floor(len/200)));
  return { potential:potential,
    verdict:potential>=80?'推荐做成知识付费产品':potential>=60?'有潜力，建议补充方法论后上架':'暂不建议，内容偏碎片化',
    reasons:[isHowTo?'内容包含方法/经验类信息，具备「可复制」属性 ✓':'内容偏叙事，缺少可复制的步骤，建议补充方法部分',
      hasData?'包含具体数据，说服力强 ✓':'缺少具体数据支撑，建议加入真实数字',
      '全文约 '+len+' 字，'+(len>500?'可作为图文资料包':'偏短，建议扩充为完整资料')],
    priceSuggestion:potential>=80?'19~99 元':potential>=60?'9.9~29 元':'建议先免费引流',
    recommendPlatforms:[{name:'闲鱼',reason:'门槛最低，适合快速验证有没有人买'},{name:'小红书',reason:'用户付费意愿相对高，适合轻咨询+资料组合'},{name:'抖音',reason:'有流量基础时可挂载课程，转化直接'}],
    outline:['第一章：我为什么要做这件事（背景与动机）','第二章：从 0 到 1 的完整步骤拆解','第三章：我踩过的坑与避坑清单','第四章：可直接套用的模板与清单','第五章：常见问题答疑'],
    disclaimer:'产品化潜力为基于文本特征的参考性评估；平台上架需你本人操作。' };
}

/* ---------------- 主题 / 模态 ---------------- */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem('aimama_theme',t); }catch(e){}
  document.querySelector('meta[name=theme-color]').setAttribute('content',t==='dark'?'#06080f':'#f2f4f9');
}
function showModal(html){ $('#modalBox').innerHTML=html; $('#modalMask').classList.remove('hidden'); }
function closeModal(){ $('#modalMask').classList.add('hidden'); }

/* ---------------- 初始化 ---------------- */
function init() {
  if (ONLINE_DEMO) enableDemo();
  let saved=null; try{ saved=localStorage.getItem('aimama_theme'); }catch(e){}
  if (saved) setTheme(saved);
  else if (window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches) setTheme('light');
  try{ const ds=localStorage.getItem('aimama_demo_settings'); if(ds) Object.assign(DEMO_STATE.settings,JSON.parse(ds)); }catch(e){}
  try{ const a=localStorage.getItem('aimama_demo_aiconfig'); if(a) Object.assign(DEMO_STATE.aiConfig,JSON.parse(a)); }catch(e){}
  try{ const m=localStorage.getItem('aimama_demo_mailconfig'); if(m) Object.assign(DEMO_STATE.mailConfig,JSON.parse(m)); }catch(e){}

  // 离线版：数据直接来自本机


  $$('.nav-item').forEach(n=>n.onclick=()=>nav(n.dataset.nav));
  $$('[data-nav]').forEach(el=>{ if(!el.classList.contains('nav-item')) el.onclick=()=>nav(el.dataset.nav); });

  $$('#typeTabs .tab').forEach(t=>{
    t.onclick=()=>{
      $$('#typeTabs .tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      if (t.dataset.sort){ STATE.sort=t.dataset.sort; STATE.type='all'; }
      else { STATE.type=t.dataset.type; STATE.sort=''; }
      loadList();
    };
  });
  let timer;
  $('#searchInput').oninput=(e)=>{ clearTimeout(timer); timer=setTimeout(()=>{ STATE.keyword=e.target.value.trim(); loadList(); },300); };
  let lTimer;
  $('#learnSearch').oninput=(e)=>{ clearTimeout(lTimer); lTimer=setTimeout(()=>{ LEARN_STATE.keyword=e.target.value.trim(); loadLearn(); },300); };
  bindLearnTabs();
  $('#themeBtn').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  $('#modalMask').onclick=(e)=>{ if(e.target.id==='modalMask') closeModal(); };
  $('#genReportBtn').onclick=async()=>{
    try {
      const data=await api('/reports/generate',{method:'POST',body:{}});
      toast('已生成 '+data.report.week+' 周报'); loadReports();
    } catch(e){}
  };
  nav('home');
}
document.addEventListener('DOMContentLoaded',init);
